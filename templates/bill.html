
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ParkSmart - Parking Summary</title>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Spline+Sans:wght@400;500;700"
        onload="this.rel='stylesheet'" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
        :root {
            --primary-color: #38e07b;
            --secondary-color: #28a058;
            --background-color: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4ce68b;
        }

        body {
            font-family: 'Spline Sans', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
        }
    </style>
</head>

<body class="bg-[var(--background-color)] text-[var(--text-primary)]">
    <div class="relative flex size-full min-h-screen flex-col">
        <!-- Header -->
            <header class="border-b border-zinc-200 dark:border-zinc-800">
                <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-20">
                        <div class="flex items-center gap-4">
                            <div class="bg-primary text-white p-2 rounded-full">
                                <span class="material-symbols-outlined">
                                    local_parking
                                </span>
                            </div>
                            <h1 class="text-2xl font-bold text-zinc-900 dark:text-white">ParkSmart</h1>
                        </div>
                        <nav class="hidden md:flex items-center gap-8">
                            <a class="text-zinc-600 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors" href="{{url_for('plates_page', email=user.email)}}">Parking Status</a>
                            <a class="text-zinc-900 dark:text-white font-semibold" href="#">My Account</a>
                        </nav>
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-cover bg-center"
                                style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDoHkB-5HDinGI-oK77zd4OtLL5jAkwsne5kw5OFubvSsaVgqsENWkHWA0P5QVNmTNWi-So71GaafsFdq8vIwxFRHhcw_8DRmTP6-7SBRE0d5nEQhkqI_kP02Mak6ncf0MnV4hwtiL8Q9mfbnvBeabYYFg3uHFeMOKQwvpjNV3JsdhzgfhrHtYcTdQgdT3q2rmlzaaIj6_CnF8wni81TF23OZAsBeSJRjPn59WGuGQM01UGhwqOiiSssu7l43gAxJ9DiGhyKyKPlP0");'>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

        <!-- Main Content -->
        <main class="flex flex-1 items-center justify-center py-12">
            <div class="w-full max-w-md mx-auto">
                <div class="bg-gray-800 rounded-2xl shadow-lg p-8 border border-gray-700">
                    <h2 class="text-3xl font-bold text-center mb-8">Parking Summary</h2>
                    <div class="space-y-6">
                        <div class="flex justify-between items-center border-b border-gray-700 pb-4">
                            <p class="text-base font-medium text-[var(--text-secondary)]">Start Time</p>
                            <p class="text-base font-semibold text-[var(--text-primary)]" id="startTime">{{startTime}}</p>
                        </div>
                        <div class="flex justify-between items-center border-b border-gray-700 pb-4">
                            <p class="text-base font-medium text-[var(--text-secondary)]">End Time</p>
                            <p class="text-base font-semibold text-[var(--text-primary)]" id="endTime">{{endTime}}</p>
                        </div>
                        <div class="flex justify-between items-center border-b border-gray-700 pb-4">
                            <p class="text-base font-medium text-[var(--text-secondary)]">Duration</p>
                            <p class="text-base font-semibold text-[var(--text-primary)]" id="duration">{{ duration }}</p>
                        </div>
                        <div class="flex justify-between items-center pt-2">
                            <p class="text-lg font-bold text-[var(--text-secondary)]">Total Bill</p>
                            <p class="text-2xl font-bold text-[var(--primary-color)]" id="total_bill">Rs {{ total_bill }}</p>
                        </div>
                    </div>
                    <div class="mt-10">
                        <button
                        onclick="initiatePayment('{{user.email}}')"
                            class="w-full bg-[var(--primary-color)] text-[var(--background-color)] px-6 py-3 rounded-full font-semibold hover:bg-[var(--accent-color)] transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-opacity-50">
                            Pay Now
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const email = '{{ user.email }}';
        // Razorpay Payment Integration
        async function initiatePayment(email) {
            try {
                // Step 1: Fetch order details from backend
                const res = await fetch(`/pay/${email}`);
                const data = await res.json();

                if (!data.id) {
                    alert("Failed to create order");
                    return;
                }

                // Step 2: Configure Razorpay
                const options = {
                    key: "rzp_test_RRlePW8ry9sAIu", // Your Razorpay Test Key
                    amount: data.amount, // amount in paisa
                    currency: "INR",
                    name: "ParkSmart",
                    description: "Parking Payment",
                    order_id: data.id,
                    handler: async function (response) {
                        // Step 3: Verify Payment on Backend
                        const verifyRes = await fetch("/verify_payment", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                email: email,
                                razorpay_payment_id: response.razorpay_payment_id,
                                razorpay_order_id: response.razorpay_order_id,
                                razorpay_signature: response.razorpay_signature
                            })
                        });

                        const result = await verifyRes.json();
                        if (result.success) {
                            alert("Payment Successful! You may now leave.");
                            location.reload();
                        } else {
                            alert("Payment verification failed!");
                        }
                    },
                    "callback_url": "{{ url_for('dashboard', email = user.email) }}",
                    prefill: {
                        email: email,
                        contact: "9999999999"
                    },
                    theme: { color: "#38e07b" }
                };

                // Step 4: Open Razorpay Popup
                const rzp = new Razorpay(options);
                rzp.open();

            } catch (err) {
                console.error(err);
                alert("Error initiating payment.");
            }
        }
    </script>
</body>
    
</html>
