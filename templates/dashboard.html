<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <style type="text/tailwindcss">
      :root {
        --primary-color: #38e07b;
        --secondary-color: #28a058;
        --background-color: #1a1a1a;
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0a0;
        --accent-color: #4ce68b;
      }
      body {
        font-family: 'Spline Sans', sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
      }
    </style>
</head>

<body class="dark">
    <div class="relative flex size-full min-h-screen flex-col bg-[var(--background-color)]">
        <!-- Header -->
            <header class="border-b border-zinc-200 dark:border-zinc-800">
                <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-20">
                        <div class="flex items-center gap-4">
                            <div class="bg-primary text-white p-2 rounded-full">
                                <span class="material-symbols-outlined">
                                    local_parking
                                </span>
                            </div>
                            <h1 class="text-2xl font-bold text-zinc-900 dark:text-white">ParkSmart</h1>
                        </div>
                        <nav class="hidden md:flex items-center gap-8">
                            <a class="text-zinc-600 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors" href="{{url_for('dashboard', email=user.email)}}">Parking Status</a>
                            <a class="text-zinc-900 dark:text-white" href="{{url_for('plates_page', email=user.email)}}">My Account</a>
                        </nav>
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-cover bg-center"
                                style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDoHkB-5HDinGI-oK77zd4OtLL5jAkwsne5kw5OFubvSsaVgqsENWkHWA0P5QVNmTNWi-So71GaafsFdq8vIwxFRHhcw_8DRmTP6-7SBRE0d5nEQhkqI_kP02Mak6ncf0MnV4hwtiL8Q9mfbnvBeabYYFg3uHFeMOKQwvpjNV3JsdhzgfhrHtYcTdQgdT3q2rmlzaaIj6_CnF8wni81TF23OZAsBeSJRjPn59WGuGQM01UGhwqOiiSssu7l43gAxJ9DiGhyKyKPlP0");'>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

      <div class="flex h-full grow flex-col">
        <main class="flex flex-1 items-center justify-center py-16">
            <div class="w-full max-w-lg p-10 space-y-10">
                <div class="text-center">
                    <h2 class="text-4xl font-extrabold text-[var(--text-primary)] mb-4 leading-tight">
                        Welcome {{ user.username }}
                    </h2>
                    <p class="text-lg text-[var(--text-secondary)] leading-relaxed">
                        Here are the details of your active parking session.
                    </p>
                </div>

                <!-- Parking Status Card -->
                <div id="status-card" class="bg-gray-800 rounded-3xl shadow-lg p-8 border border-gray-700 space-y-6">
                    <div class="flex justify-between items-center pb-4 border-b border-gray-700">
                        <p class="text-base font-medium text-[var(--text-secondary)]">Car Plate</p>
                        <p class="text-lg font-bold text-[var(--primary-color)]"><span id="plate"></span></p>
                    </div>
                    <div class="flex justify-between items-center pb-4 border-b border-gray-700">
                        <p class="text-base font-medium text-[var(--text-secondary)]">Status</p>
                        <p class="text-lg font-bold text-[var(--text-primary)]"><span id="status"></span></p>
                    </div>
                    <div class="flex justify-between items-center pb-4 border-b border-gray-700">
                        <p class="text-base font-medium text-[var(--text-secondary)]">Elapsed Time</p>
                        <p class="text-lg font-bold text-[var(--text-primary)]"><span id="elapsed"></span></p>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-base font-medium text-[var(--text-secondary)]">Bill</p>
                        <p class="text-lg font-bold text-[var(--text-primary)]">₹ <span id="bill"></span></p>
                    </div>
                </div>

                <!-- Go to bill page Button -->
                <div class="pt-6">
                    <button 
                      id="billButton"
                      style="display: none;"
                      onclick="goToBillPage('{{ user.email }}')"
                      class="w-full bg-[var(--primary-color)] text-[var(--background-color)] px-6 py-3 rounded-full font-semibold hover:bg-[var(--accent-color)] transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-opacity-50">
                        Bill Page
                    </button>
                </div>
            </div>
        </main>
      </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        const userEmail = '{{ user.email }}';
        const billButton = document.getElementById("billButton");

        async function checkBillStatus() {
            try {
            const res = await fetch(`/parkingStatus/${userEmail}`);
            const data = await res.json();

            if (data.amount_due > 0) {
                billButton.style.display = "block";
            } else {
                billButton.style.display = "none";
            }
            } catch (err) {
            console.error("Error checking bill status:", err);
            }
        }
        setInterval(checkBillStatus, 3000);
        checkBillStatus();

        function goToBillPage(email) {
            window.location.href = `/bill/${email}`;
        }

        updateStatus(userEmail);
        setInterval(() => updateStatus(userEmail), 1000);
    </script>
</body>
</html>
