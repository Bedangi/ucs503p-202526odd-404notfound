<!DOCTYPE html>
<html class="dark" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>ParkSmart - My Plates</title>
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
        <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "primary": "#38e079",
                            "background-light": "#f6f8f7",
                            "background-dark": "#122017",
                        },
                        fontFamily: {
                            "display": ["Spline Sans"]
                        },
                        borderRadius: {
                            "DEFAULT": "1rem",
                            "lg": "2rem",
                            "xl": "3rem",
                            "full": "9999px"
                        },
                    },
                },
            }
        </script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    'FILL' 0,
                    'wght' 400,
                    'GRAD' 0,
                    'opsz' 24
            }
        </style>
    </head>
    <body class="bg-background-light dark:bg-background-dark font-display text-zinc-900 dark:text-zinc-100">
        <div class="flex flex-col min-h-screen">
            <!-- Header -->
            <header class="border-b border-zinc-200 dark:border-zinc-800">
                <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-20">
                        <div class="flex items-center gap-4">
                            <div class="bg-primary text-white p-2 rounded-full">
                                <span class="material-symbols-outlined">
                                    local_parking
                                </span>
                            </div>
                            <h1 class="text-2xl font-bold text-zinc-900 dark:text-white">Welcome {{ user.name }} ParkSmart</h1>
                        </div>
                        <nav class="hidden md:flex items-center gap-8">
                            <a class="text-zinc-600 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors" href="#">Find Parking</a>
                            <a class="text-zinc-600 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors" href="#">My Bookings</a>
                            <a class="text-zinc-900 dark:text-white font-semibold" href="#">My Account</a>
                        </nav>
                        <div class="flex items-center gap-4">
                            <button class="relative rounded-full p-2 text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 hover:text-zinc-700 dark:hover:text-zinc-200 transition-colors">
                                <span class="material-symbols-outlined">notifications</span>
                            </button>
                            <div class="w-10 h-10 rounded-full bg-cover bg-center"
                                style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDoHkB-5HDinGI-oK77zd4OtLL5jAkwsne5kw5OFubvSsaVgqsENWkHWA0P5QVNmTNWi-So71GaafsFdq8vIwxFRHhcw_8DRmTP6-7SBRE0d5nEQhkqI_kP02Mak6ncf0MnV4hwtiL8Q9mfbnvBeabYYFg3uHFeMOKQwvpjNV3JsdhzgfhrHtYcTdQgdT3q2rmlzaaIj6_CnF8wni81TF23OZAsBeSJRjPn59WGuGQM01UGhwqOiiSssu7l43gAxJ9DiGhyKyKPlP0");'>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="flex-grow">
                <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white dark:bg-zinc-900/50 p-8 rounded-lg shadow-sm border border-zinc-200 dark:border-zinc-800">
                            <h2 class="text-3xl font-bold text-zinc-900 dark:text-white mb-2">My Plates</h2>
                            <p class="text-zinc-600 dark:text-zinc-400 mb-8">
                                Add and manage your vehicle license plates for faster checkouts.
                            </p>
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2" for="plateNumber">
                                        Plate Number
                                    </label>
                                    <div class="flex items-center gap-4">
                                        <input class="flex-grow block w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border border-zinc-300 dark:border-zinc-700 focus:ring-primary focus:border-primary transition-colors placeholder:text-zinc-400 dark:placeholder:text-zinc-500"
                                            id="plateNumber"
                                            placeholder="e.g., XYZ 123"
                                            type="text" />
                                        <button class="flex-shrink-0 bg-primary text-white font-bold py-3 px-6 rounded-lg hover:bg-primary/90 transition-all duration-300 ease-in-out shadow-sm">
                                            Add Plate
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-12">
                                <h3 class="text-xl font-bold text-zinc-900 dark:text-white mb-4">Added Plates</h3>
                                <div class="space-y-4">
                                    <div class="flex items-center justify-between bg-white dark:bg-zinc-900/50 p-4 rounded-lg border border-zinc-200 dark:border-zinc-800">
                                        <p class="font-mono text-lg text-zinc-800 dark:text-zinc-200 tracking-wider">XYZ 123</p>
                                        <div class="flex items-center gap-2">
                                            <button class="p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 transition-colors">
                                                <span class="material-symbols-outlined text-base">edit</span>
                                            </button>
                                            <button class="p-2 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50 text-red-500 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors">
                                                <span class="material-symbols-outlined text-base">delete</span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="flex items-center justify-between bg-white dark:bg-zinc-900/50 p-4 rounded-lg border border-zinc-200 dark:border-zinc-800">
                                            <p class="font-mono text-lg text-zinc-800 dark:text-zinc-200 tracking-wider">ABC 456</p>
                                            <div class="flex items-center gap-2">
                                                <button class="p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 transition-colors">
                                                    <span class="material-symbols-outlined text-base">edit</span>
                                                </button>
                                                <button class="p-2 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50 text-red-500 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors">
                                                    <span class="material-symbols-outlined text-base">delete</span>
                                                </button>
                                            </div>
                                    </div>
                                    <div class="flex items-center justify-between bg-white dark:bg-zinc-900/50 p-4 rounded-lg border border-zinc-200 dark:border-zinc-800">
                                        <p class="font-mono text-lg text-zinc-800 dark:text-zinc-200 tracking-wider">DEF 789</p>
                                        <div class="flex items-center gap-2">
                                            <button class="p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 transition-colors">
                                                <span class="material-symbols-outlined text-base">edit</span>
                                            </button>
                                            <button class="p-2 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50 text-red-500 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors">
                                                <span class="material-symbols-outlined text-base">delete</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <footer class="border-t border-zinc-200 dark:border-zinc-800 mt-auto">
                <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-zinc-500 dark:text-zinc-400">
                    <p>© 2025 ParkSmart. All rights reserved.</p>
                </div>
            </footer>
        </div>
    </body>
</html>
